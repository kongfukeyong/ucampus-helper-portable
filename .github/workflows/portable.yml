name: Build Windows portable ZIP
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = $env:RUNNER_TEMP
          $portable = Join-Path $temp 'UCampus-Helper-portable'
          $app = Join-Path $portable 'app'
          $runtime = Join-Path $portable 'runtime\Python312'
          $sp = Join-Path $runtime 'Lib\site-packages'

          # 1) 底座：复用超星便携包的运行时 / FFmpeg / Whisper 模型
          $baseZip = Join-Path $temp 'chaoxing-base.zip'
          Invoke-WebRequest -Uri 'https://github.com/kongfukeyong/chaoxing-chapter-helper/releases/download/v0.1.3/Chaoxing-Helper-portable-win64.zip' -OutFile $baseZip
          $expected = 'ab43784aee31422fc3f8eaa12359d256b815f6d8a89d0c3ec751f6075fc2a12e'
          if ((Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Base runtime checksum mismatch' }
          Expand-Archive $baseZip -DestinationPath (Join-Path $temp 'base') -Force
          $base = Join-Path $temp 'base\Chaoxing-Helper'
          New-Item -ItemType Directory -Force -Path $app, (Join-Path $app 'data\models'), (Join-Path $app 'ffmpeg\bin') | Out-Null
          robocopy (Join-Path $base 'runtime\Python312') $runtime /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -gt 7) { throw 'Runtime copy failed' }
          Copy-Item (Join-Path $base 'ffmpeg\ffmpeg.exe') (Join-Path $app 'ffmpeg\bin\ffmpeg.exe')
          Copy-Item (Join-Path $base 'data\models\base.pt') (Join-Path $app 'data\models\base.pt')

          # 2) 应用文件
          foreach ($name in @('UnipusAI_Helper.py','config.example.json','README.md','LICENSE','requirements.txt')) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $app $name)
          }
          Copy-Item -LiteralPath 'unipus_helper' -Destination (Join-Path $app 'unipus_helper') -Recurse

          # 3) 先备份底座自带的 MSVC 运行时，再清掉不再使用的 PyQt5
          $qt5bin = Join-Path $sp 'PyQt5\Qt5\bin'
          if (Test-Path $qt5bin) {
            foreach ($dll in @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','concrt140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
              $src = Join-Path $qt5bin $dll
              if (Test-Path $src) { Copy-Item $src $runtime }
            }
          }
          foreach ($name in @('PyQt5','PyQt5-5.15.11.dist-info','PyQt5_Qt5-5.15.2.dist-info')) {
            $p = Join-Path $sp $name
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          Get-ChildItem $sp -Filter 'PyQt5_sip*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          # 4) 依赖装进内嵌运行时（PySide6 / edge-tts 及其依赖）
          python -m pip install --target $sp --only-binary=:all: 'PySide6-Essentials>=6.8,<7' 'edge-tts>=7.3.1'

          # 5) 启动脚本与说明
          $startLines = @(
            '@echo off',
            'cd /d "%~dp0app"',
            'set "PATH=%~dp0runtime\Python312;%CD%\ffmpeg\bin;%PATH%"',
            'set "NO_PROXY=*"',
            '"%~dp0runtime\Python312\python.exe" UnipusAI_Helper.py --skip-check',
            'if errorlevel 1 pause'
          )
          Set-Content -Path (Join-Path $portable 'start.cmd') -Value $startLines -Encoding ascii
          Copy-Item -LiteralPath '使用说明.txt' -Destination $portable

          Compress-Archive -Path $portable -DestinationPath (Join-Path $temp 'UCampus-Helper-portable-win64.zip') -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ucampus-portable-win64
          path: ${{ runner.temp }}/UCampus-Helper-portable-win64.zip
