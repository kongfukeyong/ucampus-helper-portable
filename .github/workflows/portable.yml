name: Build Windows portable ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $temp = $env:RUNNER_TEMP
          $baseZip = Join-Path $temp 'chaoxing-base.zip'
          $baseDir = Join-Path $temp 'base'
          $portable = Join-Path $temp 'UCampus-Helper-portable'
          $app = Join-Path $portable 'app'
          $zip = Join-Path $temp 'UCampus-Helper-portable-win64.zip'
          New-Item -ItemType Directory -Force -Path $baseDir, $app, (Join-Path $app 'ffmpeg/bin'), (Join-Path $app 'data/models'), (Join-Path $app 'drivers') | Out-Null
          gh release download v0.1.3 --repo kongfukeyong/chaoxing-chapter-helper --pattern 'Chaoxing-Helper-portable-win64.zip' --dir $temp
          Move-Item (Join-Path $temp 'Chaoxing-Helper-portable-win64.zip') $baseZip
          $expected = 'ab43784aee31422fc3f8eaa12359d256b815f6d8a89d0c3ec751f6075fc2a12e'
          if ((Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Base runtime checksum mismatch' }
          Expand-Archive $baseZip -DestinationPath $baseDir
          $base = Join-Path $baseDir 'Chaoxing-Helper'
          robocopy (Join-Path $base 'runtime/Python312') (Join-Path $portable 'runtime/Python312') /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -gt 7) { throw 'Runtime copy failed' }
          Copy-Item (Join-Path $base 'ffmpeg/ffmpeg.exe') (Join-Path $app 'ffmpeg/bin/ffmpeg.exe')
          Copy-Item (Join-Path $base 'data/models/base.pt') (Join-Path $app 'data/models/base.pt')
          foreach ($name in @('UnipusAI_Helper.py','AudioRecognizer.py','EnvironmentChecker.py','fluent_ui.py','config_editor.py','config.example.json','requirements.txt','LICENSE','README.md')) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $app $name)
          }
          Copy-Item -LiteralPath 'images' -Destination (Join-Path $app 'images') -Recurse
          Copy-Item -LiteralPath 'start.cmd','configure.cmd' -Destination $portable
          $driverZip = Join-Path $temp 'edgedriver.zip'
          Invoke-WebRequest 'https://msedgedriver.microsoft.com/157.0.4341.46/edgedriver_win64.zip' -OutFile $driverZip
          Expand-Archive $driverZip -DestinationPath (Join-Path $app 'drivers')
          if (Test-Path (Join-Path $app 'config.json')) { throw 'Private config included' }
          & (Join-Path $portable 'runtime/Python312/python.exe') -m py_compile (Join-Path $app 'UnipusAI_Helper.py') (Join-Path $app 'AudioRecognizer.py')
          if ($LASTEXITCODE -ne 0) { throw 'Python compile failed' }
          Push-Location $temp
          try {
            & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=1 $zip 'UCampus-Helper-portable' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'ZIP creation failed' }
          } finally { Pop-Location }
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release create v1.0.0 $zip --repo $env:GITHUB_REPOSITORY --title 'U 校园便携版 v1.0.0' --notes "Windows x64 便携版；首次启动填写自己的配置。SHA-256: $digest"
          Write-Output "SHA-256: $digest"
